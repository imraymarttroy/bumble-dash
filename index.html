<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#7ec8e3" />
  <meta name="description" content="Jeme-Jeme - a tiny tap-to-flap browser game. Play solo or with up to 4 friends." />
  <title>Jeme-Jeme</title>
  <link rel="stylesheet" href="css/style.css?v=4" />
</head>
<body>
  <main id="wrap">
    <canvas id="game" width="900" height="600" aria-label="Jeme-Jeme game"></canvas>

    <div id="menu" class="overlay">
      <div class="card">
        <h1>JEME-JEME</h1>
        <p class="sub">a very clumsy flyer</p>

        <section data-screen="main">
          <input id="nameInput" class="name" placeholder="Your name" maxlength="12" autocomplete="off" />
          <button id="btnSolo" class="primary">&#9654; Play Solo</button>
          <div class="divider"><span>Multiplayer &middot; up to 4</span></div>
          <button id="btnCreate">Create Room</button>
          <div class="row">
            <input id="codeInput" class="code-in" placeholder="CODE" maxlength="5" autocomplete="off" autocapitalize="characters" spellcheck="false" />
            <button id="btnJoin">Join</button>
          </div>
        </section>

        <section data-screen="lobby" hidden>
          <div class="label">Room code</div>
          <div id="roomCode" class="room-code">-----</div>
          <button id="btnCopy" class="small">Copy invite link</button>
          <ul id="playerList"></ul>
          <button id="btnStart" class="primary">Start game</button>
          <p id="waitText" class="wait">Waiting for the host to start&hellip;</p>
          <button id="btnLeave" class="ghost">Leave room</button>
        </section>

        <p id="status" role="status"></p>
      </div>
    </div>

    <button id="btnMenu" hidden>&#9776; Menu</button>
  </main>
  <p class="hint">Space / Click / Tap to flap &middot; P to pause &middot; M to mute</p>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="js/audio.js?v=4"></script>
  <script src="js/entities.js?v=4"></script>
  <script src="js/net.js?v=4"></script>
  <script src="js/game.js?v=4"></script>
</body>
</html>
